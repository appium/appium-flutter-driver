name: Python

on:
  workflow_dispatch:
  push:
    paths:
      - 'finder/python/**'
      - '.github/workflows/finder-python.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'finder/python/**'
      - '.github/workflows/finder-python.yml'
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pylint pytest twine Appium-Python-Client
    - name: Analyzing the code with pylint
      run: pylint tests/ appium_flutter_finder/
      working-directory: finder/python
    - name: Run tests
      run: pytest tests/**
      working-directory: finder/python
    - name: Build distributions
      run: |
        python -m build
        python -m twine check dist/*
        ls dist/appium_flutter_finder-*.tar.gz
        ls dist/appium_flutter_finder-*.whl
      working-directory: finder/python
